# Scoped local evidence; no official quality-scale claim in manifest.
rules:
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: No periodic polling; directory fetched on setup or explicit action.
  brands: done
  common-modules:
    status: exempt
    comment: No entities or coordinator. HTTP client and services each have a module.
  config-flow: done
  config-flow-test-coverage:
    status: todo
    comment: Native config/reconfigure/reauth/options manager tests exist; branch coverage not yet measured.
  dependency-transparency:
    status: exempt
    comment: No additional dependencies; aiohttp/voluptuous supplied by Home Assistant.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: No entities or listeners.
  entity-unique-id:
    status: exempt
    comment: No entities.
  has-entity-name:
    status: exempt
    comment: No entities.
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
